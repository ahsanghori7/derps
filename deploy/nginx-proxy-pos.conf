# Add inside the derps (or other DRMS) server { } block so /proxy-pos mirrors Vite dev proxy.
# Required for tenant logos hosted on pos.gotmsolutions.com in PDF/html2canvas flows.
location /proxy-pos/ {
    proxy_pass https://pos.gotmsolutions.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host pos.gotmsolutions.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
